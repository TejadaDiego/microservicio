<!DOCTYPE html>
<html>
<head>
    <title>Gestor de Notas</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        input { margin: 5px; }
        button { margin: 5px; }
        table, th, td { border: 1px solid black; border-collapse: collapse; padding: 8px; }
    </style>
</head>
<body>

<h2>Gestor de Notas de Estudiantes</h2>

<h3>Registrar / Editar Nota</h3>

<form id="formNota">
    <input type="hidden" id="id">

    ID Estudiante: <input type="number" id="estudianteId" required><br>
    Curso: <input type="text" id="curso" required><br>
    Nota: <input type="number" id="nota" step="0.1" required><br>

    <button type="submit">Guardar</button>
</form>

<h3>Lista de Notas</h3>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Estudiante</th>
            <th>Curso</th>
            <th>Nota</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody id="tablaNotas"></tbody>
</table>

<script>
let editando = false;

document.getElementById("formNota").addEventListener("submit", async function(e){
    e.preventDefault();

    let id = document.getElementById("id").value;
    let estudianteId = document.getElementById("estudianteId").value;
    let curso = document.getElementById("curso").value;
    let notaValor = document.getElementById("nota").value;

    if(!estudianteId){
        alert("Debe ingresar ID de estudiante existente");
        return;
    }

    let nota = {
        estudiante: { id: parseInt(estudianteId) },
        curso: curso,
        nota: parseFloat(notaValor)
    };

    let url = "http://localhost:8080/notas";
    let method = "POST";

    if(editando){
        url += "/" + id;
        method = "PUT";
    }

    try {
        let res = await fetch(url, {
            method: method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(nota)
        });

        if(!res.ok){
            throw new Error("Error: el estudiante NO existe o fallo backend");
        }

        limpiarFormulario();
        cargarNotas();

    } catch (err){
        alert(err.message);
    }
});

async function cargarNotas(){
    try {
        let res = await fetch("http://localhost:8080/notas");
        let data = await res.json();

        let tabla = document.getElementById("tablaNotas");
        tabla.innerHTML = "";

        data.forEach(n => {
            tabla.innerHTML += `
                <tr>
                    <td>${n.id}</td>
                    <td>${n.estudiante ? n.estudiante.nombre : 'Sin estudiante'}</td>
                    <td>${n.curso}</td>
                    <td>${n.nota}</td>
                    <td>
                        <button onclick="editar(${n.id}, ${n.estudiante ? n.estudiante.id : 0}, '${n.curso}', ${n.nota})">Editar</button>
                        <button onclick="eliminar(${n.id})">Eliminar</button>
                    </td>
                </tr>
            `;
        });

    } catch (error){
        console.error("Error cargando notas:", error);
    }
}

function editar(id, estudianteId, curso, nota){
    document.getElementById("id").value = id;
    document.getElementById("estudianteId").value = estudianteId;
    document.getElementById("curso").value = curso;
    document.getElementById("nota").value = nota;

    editando = true;
}

async function eliminar(id){
    if(!confirm("¿Eliminar esta nota?")) return;

    await fetch("http://localhost:8080/notas/" + id, {
        method: "DELETE"
    });

    cargarNotas();
}

function limpiarFormulario(){
    document.getElementById("id").value = "";
    document.getElementById("formNota").reset();
    editando = false;
}

cargarNotas();
</script>

</body>
</html>
